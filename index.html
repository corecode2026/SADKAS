<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>هدية خاصة 💌</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@300;400;500;600;700&display=swap');

:root{
  --bg:#FBF3F0; --bg-alt:#F5E4E1; --ink:#3F2A2E; --muted:#8B6F73;
  --rose:#D88C9A; --rose-deep:#B5677A; --gold:#C9A876; --white:#FFFFFF;
  --shadow:0 20px 50px -20px rgba(74,46,53,.35);
  --radius-lg:28px; --radius-md:18px; --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Cairo',sans-serif;overflow-x:hidden;}
body{direction:rtl;}
h1,h2,h3{font-family:'Aref Ruqaa',serif;font-weight:700;margin:0;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
.hidden{display:none !important;}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important;}
  .message-scroll-viewport{height:auto !important;max-height:none !important;overflow:visible !important;mask-image:none !important;-webkit-mask-image:none !important;}
  #msgBody{position:static !important;transform:none !important;}
}

#lock-screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:100;overflow:hidden;}
.lock-bg{position:absolute;inset:0;background:
  radial-gradient(circle at 20% 15%, rgba(216,140,154,.55), transparent 55%),
  radial-gradient(circle at 85% 80%, rgba(201,168,118,.4), transparent 50%),
  linear-gradient(160deg,#4A2E35 0%,#6B3C46 45%,#8C5A63 100%);}
.lock-content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;color:var(--white);padding:24px;width:100%;max-width:360px;text-align:center;transition:opacity .5s var(--ease),transform .5s var(--ease),filter .5s var(--ease);}
.lock-heart{font-size:34px;margin-bottom:6px;animation:pulse 2.4s ease-in-out infinite;filter:drop-shadow(0 4px 10px rgba(0,0,0,.25));}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.92;}50%{transform:scale(1.12);opacity:1;}}
.lock-title{font-size:15px;font-weight:400;letter-spacing:.5px;color:rgba(255,255,255,.85);margin-bottom:26px;min-height:19px;}
.passcode-dots{display:flex;gap:14px;margin-bottom:26px;min-height:14px;}
.dot{width:12px;height:12px;border-radius:50%;border:1.5px solid rgba(255,255,255,.75);background:transparent;transition:background .18s var(--ease),transform .18s var(--ease);}
.dot.filled{background:var(--white);transform:scale(1.05);}
.dot.shake-anim{animation:shake .4s var(--ease);}
@keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-6px);}40%{transform:translateX(6px);}60%{transform:translateX(-4px);}80%{transform:translateX(4px);}}
.keypad{display:grid;grid-template-columns:repeat(3,68px);gap:18px;justify-content:center;}
.key{width:68px;height:68px;border-radius:50%;background:rgba(255,255,255,.12);backdrop-filter:blur(6px);color:var(--white);font-size:24px;font-weight:500;display:flex;align-items:center;justify-content:center;transition:background .15s var(--ease),transform .1s var(--ease);-webkit-tap-highlight-color:transparent;}
.key:active{background:rgba(255,255,255,.28);transform:scale(.94);}
.key.key-empty{background:transparent;cursor:default;}
.key.key-empty:active{background:transparent;transform:none;}
.key-back{font-size:20px;}
.lock-error{min-height:20px;margin-top:18px;font-size:13px;color:#FFE1E6;opacity:0;transition:opacity .25s var(--ease);}
.lock-error.show{opacity:1;}
.lock-loading{color:rgba(255,255,255,.7);font-size:13px;}
.petal-burst{position:absolute;inset:0;z-index:3;pointer-events:none;}
.petal{position:absolute;top:50%;left:50%;width:10px;height:10px;border-radius:50% 0 50% 50%;background:var(--rose);opacity:.9;}

#content{min-height:100vh;opacity:0;transform:scale(1.02);filter:blur(6px);transition:opacity .7s var(--ease),transform .7s var(--ease),filter .7s var(--ease);}
#content.revealed{opacity:1;transform:scale(1);filter:blur(0);}
.page{min-height:100vh;display:none;flex-direction:column;align-items:center;justify-content:center;padding:60px 24px 140px;text-align:center;}
.page.active{display:flex;animation:fadeUp .6s var(--ease);}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
.eyebrow{color:var(--muted);font-size:13px;letter-spacing:1px;margin-bottom:14px;}
#msgTitle{font-size:clamp(28px,6vw,44px);color:var(--rose-deep);margin-bottom:22px;line-height:1.4;}
.message-scroll-viewport{position:relative;width:100%;max-width:560px;height:260px;max-height:42vh;overflow:hidden;margin:0 auto 36px;
  -webkit-mask-image:linear-gradient(to bottom, transparent 0%, black 14%, black 86%, transparent 100%);
  mask-image:linear-gradient(to bottom, transparent 0%, black 14%, black 86%, transparent 100%);
  cursor:pointer;}
#msgBody{position:absolute;top:0;left:0;width:100%;font-size:18px;line-height:2.1;color:var(--ink);white-space:pre-wrap;}
.scroll-hint{font-size:12px;color:var(--muted);margin-bottom:26px;opacity:.75;}
.btn-next{background:var(--rose-deep);color:var(--white);padding:14px 38px;border-radius:999px;font-size:16px;font-weight:600;box-shadow:var(--shadow);transition:transform .2s var(--ease),box-shadow .2s var(--ease);}
.btn-next:hover{transform:translateY(-2px);box-shadow:0 24px 55px -18px rgba(74,46,53,.45);}
#page-memories h2{font-size:clamp(26px,5vw,36px);color:var(--rose-deep);margin-bottom:36px;}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:20px;width:100%;max-width:980px;}
.memory-card{position:relative;border-radius:var(--radius-md);overflow:hidden;background:var(--white);box-shadow:0 12px 30px -16px rgba(74,46,53,.3);cursor:pointer;transition:transform .3s var(--ease);}
.memory-card:hover{transform:translateY(-4px);}
.memory-card img,.memory-card video{width:100%;height:220px;object-fit:cover;display:block;}
.memory-caption{padding:12px 14px 14px;text-align:right;}
.memory-caption .cap-text{font-size:14px;color:var(--ink);margin-bottom:4px;}
.memory-caption .cap-date{font-size:12px;color:var(--muted);}
.play-badge{position:absolute;top:10px;left:10px;background:rgba(63,42,46,.65);color:#fff;font-size:11px;padding:4px 9px;border-radius:999px;}
.empty-note{color:var(--muted);font-size:15px;padding:30px;}
.lightbox{position:fixed;inset:0;z-index:200;background:rgba(30,18,20,.92);display:flex;align-items:center;justify-content:center;padding:30px;animation:fadeIn .25s var(--ease);}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.lightbox img,.lightbox video{max-width:92vw;max-height:80vh;border-radius:12px;box-shadow:0 30px 70px rgba(0,0,0,.5);}
.lightbox-caption{position:absolute;bottom:40px;color:#fff;text-align:center;max-width:600px;font-size:14px;}
.lightbox-close{position:absolute;top:22px;left:26px;color:#fff;font-size:30px;line-height:1;}
.music-player{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-radius:999px;padding:10px 18px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);z-index:50;}
.music-player button{width:38px;height:38px;border-radius:50%;background:var(--rose-deep);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;}
.music-player .song-name{font-size:13px;color:var(--ink);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.music-note-icon{font-size:14px;color:var(--gold);}
.demo-badge{position:fixed;top:14px;right:14px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:5px 12px;border-radius:999px;z-index:999;}
@media (max-width:420px){.keypad{grid-template-columns:repeat(3,60px);gap:14px;}.key{width:60px;height:60px;font-size:21px;}}
</style>
</head>
<body>

<div class="demo-badge hidden" id="modeBadge"></div>

<!-- شاشة القفل -->
<div id="lock-screen">
  <div class="lock-bg"></div>
  <div class="lock-content">
    <div class="lock-heart">♥</div>
    <div class="lock-title" id="lockTitleName"></div>
    <div class="passcode-dots" id="dots"></div>
    <div class="keypad" id="keypad"></div>
    <div class="lock-error" id="errorMsg"></div>
  </div>
</div>

<!-- المحتوى -->
<div id="content" class="hidden">
  <section id="page-message" class="page active">
    <div class="eyebrow">رسالة خاصة</div>
    <h1 id="msgTitle"></h1>
    <div class="message-scroll-viewport" id="msgViewport">
      <p id="msgBody"></p>
    </div>
    <div class="scroll-hint">المس النص لإيقافه والقراءة بهدوء</div>
    <button class="btn-next" id="nextBtn"></button>
  </section>

  <section id="page-memories" class="page">
    <h2>ذكرياتنا 🤍</h2>
    <div class="gallery" id="gallery"></div>
  </section>

  <div class="lightbox hidden" id="lightbox">
    <button class="lightbox-close" id="lightboxClose">×</button>
    <div id="lightboxInner"></div>
    <div class="lightbox-caption" id="lightboxCaption"></div>
  </div>

  <div class="music-player hidden" id="musicPlayer">
    <button id="playPause">▶</button>
    <span class="music-note-icon">♪</span>
    <span class="song-name" id="songName"></span>
  </div>
</div>

<!-- ============================================================
     إعدادات Firebase — عدّل القيم لربط الموقع بمشروعك
     طالما القيم لم تُعدَّل، سيعمل الموقع تلقائيًا بوضع معاينة محلي
     (البيانات تُحفظ في هذا المتصفح فقط عبر localStorage)
     ============================================================ -->
<script>
  window.FIREBASE_CONFIG = {
    apiKey: "AIzaSyASafGbGKlU_uKhDhSsPxc6WSgkQCsSZ1o",
    authDomain: "sadkas-19b5e.firebaseapp.com",
    projectId: "sadkas-19b5e",
    storageBucket: "sadkas-19b5e.firebasestorage.app",
    messagingSenderId: "907104429201",
    appId: "1:907104429201:web:0563629998ab086b4ecb30"
  };
</script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

<script>
// ============================================================
// طبقة البيانات: تعمل محليًا (localStorage) إن لم يتم إعداد Firebase،
// وتتحول تلقائيًا لـ Firebase بمجرد وضع بيانات مشروعك الحقيقية أعلاه.
// ============================================================
const IS_FIREBASE_CONFIGURED = window.FIREBASE_CONFIG.apiKey && !window.FIREBASE_CONFIG.apiKey.includes('PASTE_YOUR');

const LS_KEYS = { settings:'gift_settings', memories:'gift_memories', songs:'gift_songs' };

function lsGet(key, fallback){
  try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch(e){ return fallback; }
}
function lsSet(key, val){ localStorage.setItem(key, JSON.stringify(val)); }

const LocalBackend = {
  async getSettings(){ return lsGet(LS_KEYS.settings, null); },
  async listMemories(type){
    const all = lsGet(LS_KEYS.memories, []);
    return all.filter(m => m.type === type).sort((a,b) => a.order - b.order);
  },
  async listSongs(){
    return lsGet(LS_KEYS.songs, []).sort((a,b) => a.order - b.order);
  }
};

let FirebaseBackend = null;
if(IS_FIREBASE_CONFIGURED){
  try{
    firebase.initializeApp(window.FIREBASE_CONFIG);
    const db = firebase.firestore();
    FirebaseBackend = {
      async getSettings(){
        const doc = await db.collection('settings').doc('gift').get();
        return doc.exists ? doc.data() : null;
      },
      async listMemories(type){
        const snap = await db.collection('memories').where('type','==',type).orderBy('order','asc').get();
        return snap.docs.map(d => d.data());
      },
      async listSongs(){
        const snap = await db.collection('songs').orderBy('order','asc').get();
        return snap.docs.map(d => d.data());
      }
    };
  } catch(e){ console.error('Firebase init failed, falling back to local mode:', e); }
}

const backend = FirebaseBackend || LocalBackend;

const modeBadge = document.getElementById('modeBadge');
if(!FirebaseBackend){
  modeBadge.textContent = 'وضع معاينة محلي — لم يُربط Firebase بعد';
  modeBadge.classList.remove('hidden');
}

// ============================================================
// منطق الموقع
// ============================================================

let GIFT_SETTINGS = null;
let enteredCode = '';
let isChecking = false;

const lockScreen = document.getElementById('lock-screen');
const dotsWrap = document.getElementById('dots');
const keypadWrap = document.getElementById('keypad');
const errorMsg = document.getElementById('errorMsg');
const content = document.getElementById('content');

const KEY_LAYOUT = ['1','2','3','4','5','6','7','8','9','','0','back'];

function buildKeypad(){
  keypadWrap.innerHTML = '';
  KEY_LAYOUT.forEach(k => {
    const btn = document.createElement('button');
    btn.type = 'button';
    if(k === ''){ btn.className='key key-empty'; btn.disabled=true; }
    else if(k === 'back'){ btn.className='key key-back'; btn.innerHTML='⌫'; btn.addEventListener('click', onBackspace); }
    else{ btn.className='key'; btn.textContent=k; btn.addEventListener('click', () => onDigit(k)); }
    keypadWrap.appendChild(btn);
  });
}

function renderDots(){
  const target = (GIFT_SETTINGS && GIFT_SETTINGS.password) ? GIFT_SETTINGS.password.length : 4;
  dotsWrap.innerHTML = '';
  for(let i=0;i<Math.max(target, enteredCode.length);i++){
    const d = document.createElement('div');
    d.className = 'dot' + (i < enteredCode.length ? ' filled' : '');
    dotsWrap.appendChild(d);
  }
}

function onDigit(d){
  if(isChecking || !GIFT_SETTINGS) return;
  enteredCode += d;
  renderDots();
  hideError();
  const target = GIFT_SETTINGS.password || '';
  if(enteredCode.length >= target.length) checkPassword();
}

function onBackspace(){
  if(isChecking) return;
  enteredCode = enteredCode.slice(0,-1);
  renderDots();
}

function checkPassword(){
  isChecking = true;
  const target = GIFT_SETTINGS.password || '';
  if(enteredCode === target && target.length > 0){
    unlock();
  } else {
    showError('كلمة السر غير صحيحة، حاول مجددًا 💭');
    dotsWrap.querySelectorAll('.dot').forEach(d => d.classList.add('shake-anim'));
    setTimeout(() => { enteredCode=''; renderDots(); isChecking=false; }, 450);
  }
}

function showError(msg){ errorMsg.textContent = msg; errorMsg.classList.add('show'); }
function hideError(){ errorMsg.classList.remove('show'); }

function unlock(){
  spawnPetals();
  setTimeout(() => {
    lockScreen.style.opacity = '0';
    lockScreen.style.pointerEvents = 'none';
    content.classList.remove('hidden');
    requestAnimationFrame(() => content.classList.add('revealed'));
    setTimeout(() => lockScreen.remove(), 700);
    setTimeout(() => startMessageScroll(), 750);
  }, 550);
}

function spawnPetals(){
  const burst = document.createElement('div');
  burst.className = 'petal-burst';
  lockScreen.appendChild(burst);
  const count = 26;
  for(let i=0;i<count;i++){
    const p = document.createElement('div');
    p.className = 'petal';
    const angle = (Math.PI*2*i)/count + Math.random()*0.3;
    const dist = 120 + Math.random()*160;
    const dx = Math.cos(angle)*dist, dy = Math.sin(angle)*dist;
    p.style.background = i % 2 === 0 ? 'var(--rose)' : 'var(--gold)';
    p.animate([
      { transform:'translate(-50%,-50%) scale(0.4)', opacity:1 },
      { transform:`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(1) rotate(${Math.random()*180}deg)`, opacity:0 }
    ], { duration:900+Math.random()*400, easing:'cubic-bezier(.22,.61,.36,1)', fill:'forwards' });
    burst.appendChild(p);
  }
  setTimeout(() => burst.remove(), 1500);
}

function applySettingsToContent(){
  document.title = GIFT_SETTINGS.coupleName ? `لأجل ${GIFT_SETTINGS.coupleName}` : 'هدية خاصة 💌';
  document.getElementById('lockTitleName').textContent = GIFT_SETTINGS.coupleName || 'من أجلكِ';
  document.getElementById('msgTitle').textContent = GIFT_SETTINGS.messageTitle || 'إلى أجمل من عرفت';
  const msgText = GIFT_SETTINGS.message || 'اكتب رسالتك من لوحة التحكم...';
  document.getElementById('msgBody').textContent = msgText;
  document.getElementById('nextBtn').textContent = GIFT_SETTINGS.buttonText || 'التالي ❤️';
}

let messageAnim = null;
let messageManuallyPaused = false;

function startMessageScroll(){
  const viewport = document.getElementById('msgViewport');
  const el = document.getElementById('msgBody');
  if(!viewport || !el) return;

  const prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(prefersReduced){
    viewport.style.height = 'auto';
    viewport.style.overflow = 'visible';
    el.style.position = 'static';
    return;
  }

  const containerHeight = viewport.clientHeight;
  const textHeight = el.scrollHeight;

  // إن كان النص أقصر من صندوق العرض، لا داعي للتمرير — يظهر ثابتًا في المنتصف
  if(textHeight <= containerHeight){
    el.style.position = 'static';
    viewport.style.height = 'auto';
    viewport.style.display = 'flex';
    viewport.style.alignItems = 'center';
    return;
  }

  const totalDistance = containerHeight + textHeight; // من الدخول الكامل من الأسفل إلى الخروج الكامل من الأعلى
  const speedPxPerSec = 26; // سرعة القراءة المريحة
  const duration = Math.max(10000, (totalDistance / speedPxPerSec) * 1000);

  if(messageAnim) messageAnim.cancel();
  messageAnim = el.animate([
    { transform: `translateY(${containerHeight}px)` },
    { transform: `translateY(${-textHeight}px)` }
  ], { duration, iterations: Infinity, easing: 'linear' });

  viewport.addEventListener('click', () => {
    messageManuallyPaused = !messageManuallyPaused;
    if(!messageAnim) return;
    if(messageManuallyPaused) messageAnim.pause(); else messageAnim.play();
  });
}

function goToMemories(){
  document.getElementById('page-message').classList.remove('active');
  document.getElementById('page-memories').classList.add('active');
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

async function loadMemories(){
  const gallery = document.getElementById('gallery');
  gallery.innerHTML = '';
  const [images, videos] = await Promise.all([backend.listMemories('image'), backend.listMemories('video')]);
  const all = [...images, ...videos].sort((a,b) => a.order - b.order);
  if(!all.length){ gallery.innerHTML = '<div class="empty-note">لم تُضَف ذكريات بعد</div>'; return; }
  all.forEach(m => {
    const card = document.createElement('div');
    card.className = 'memory-card';
    if(m.type === 'video') card.innerHTML = `<span class="play-badge">فيديو ▶</span><video src="${m.url}" muted></video>`;
    else card.innerHTML = `<img src="${m.url}" alt="${m.caption||''}" loading="lazy">`;
    if(m.caption || m.date){
      const cap = document.createElement('div');
      cap.className = 'memory-caption';
      cap.innerHTML = `${m.caption?`<div class="cap-text">${escapeHtml(m.caption)}</div>`:''}${m.date?`<div class="cap-date">${escapeHtml(m.date)}</div>`:''}`;
      card.appendChild(cap);
    }
    card.addEventListener('click', () => openLightbox(m));
    gallery.appendChild(card);
  });
}

function openLightbox(m){
  const lb = document.getElementById('lightbox');
  const inner = document.getElementById('lightboxInner');
  inner.innerHTML = m.type === 'video' ? `<video src="${m.url}" controls autoplay></video>` : `<img src="${m.url}" alt="">`;
  document.getElementById('lightboxCaption').textContent = [m.caption, m.date].filter(Boolean).join(' — ');
  lb.classList.remove('hidden');
}

document.getElementById('lightboxClose').addEventListener('click', () => {
  const lb = document.getElementById('lightbox');
  document.getElementById('lightboxInner').innerHTML = '';
  lb.classList.add('hidden');
});

let audioEl = null, isPlaying = false;

async function loadMusic(){
  const songs = await backend.listSongs();
  if(!songs.length) return;
  const song = songs.find(s => s.isDefault) || songs[0];
  audioEl = new Audio(song.url);
  audioEl.loop = true;
  document.getElementById('songName').textContent = song.name || 'أغنيتنا';
  document.getElementById('musicPlayer').classList.remove('hidden');
}

document.getElementById('playPause').addEventListener('click', () => {
  if(!audioEl) return;
  if(isPlaying) audioEl.pause(); else audioEl.play().catch(()=>{});
  isPlaying = !isPlaying;
  document.getElementById('playPause').textContent = isPlaying ? '❚❚' : '▶';
});

async function init(){
  buildKeypad();
  renderDots();
  try{
    GIFT_SETTINGS = await backend.getSettings();
    if(!GIFT_SETTINGS) GIFT_SETTINGS = { password:'1234' };
  } catch(e){
    console.error(e);
    GIFT_SETTINGS = { password:'1234' };
  }
  renderDots();
  applySettingsToContent();
  document.getElementById('nextBtn').addEventListener('click', goToMemories);
  loadMemories();
  loadMusic();
}

init();
</script>
</body>
</html>
